name: release
# Push a tag like v0.0.2 (matching the version in plugins/ccx/lib/ccx/__init__.py
# and both plugin.json files) to publish a GitHub Release. Installed copies of
# ccx notice it and update (automatically, unless turned off in the ⇄ menu).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "__version__ = \"$v\"" plugins/ccx/lib/ccx/__init__.py
          grep -q "\"version\": \"$v\"" plugins/ccx/.claude-plugin/plugin.json
          grep -q "\"version\": \"$v\"" plugins/ccx/.codex-plugin/plugin.json
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build menu bar app
        env:
          # The runner is one architecture; the app has to run on both.
          CCX_UNIVERSAL: "1"
        run: sh menubar/build.sh "$RUNNER_TEMP/ccx.app" "$PWD/plugins/ccx/bin/ccx" "${GITHUB_REF_NAME#v}"
      - name: The app runs on both kinds of Mac
        run: |
          lipo -info "$RUNNER_TEMP/ccx.app/Contents/MacOS/ccx"
          lipo -info "$RUNNER_TEMP/ccx.app/Contents/MacOS/ccx" | grep -q "x86_64"
          lipo -info "$RUNNER_TEMP/ccx.app/Contents/MacOS/ccx" | grep -q "arm64"
      - name: Pack the app for download
        run: |
          # The app is built from source, so it carries no Developer ID
          # signature and macOS asks the user to confirm it on first launch.
          # That is the same trade the install script makes, so the zip is
          # offered as the app itself rather than as a way to skip the script.
          cd "$RUNNER_TEMP"
          ditto -c -k --keepParent ccx.app "ccx-${GITHUB_REF_NAME#v}-macos.zip"
          ls -l "ccx-${GITHUB_REF_NAME#v}-macos.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          asset="ccx-${GITHUB_REF_NAME#v}-macos.zip"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "ccx $GITHUB_REF_NAME · Claude ⇄ Codex ⇄ Antigravity" --notes-file "$notes" "$RUNNER_TEMP/$asset"
          else
            gh release create "$GITHUB_REF_NAME" --title "ccx - claudecodex $GITHUB_REF_NAME" --generate-notes "$RUNNER_TEMP/$asset"
          fi
