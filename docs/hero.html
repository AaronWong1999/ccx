<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of docs/hero.png (1280x640, rendered at 2x). Same light look as the launch video:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --force-device-scale-factor=2 --window-size=1280,640 --screenshot=docs/hero.png docs/hero.html
     Read top to bottom: the name, what it does, how to use it in three steps, where to find it. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111113; --ink2: #6E6E73; --claude: #D97757; --codex: #2F6BFF; --red: #E5484D; --green: #1F9D55;
          --grad: linear-gradient(135deg, #F08A5D 0%, #A55CFF 52%, #3F7BFF 100%); --side: 64px; }
  body { width: 1280px; height: 640px; overflow: hidden; position: relative; color: var(--ink);
         font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
         background: #F4F4F1; -webkit-font-smoothing: antialiased; }
  .glow { position: absolute; inset: 0; background:
      radial-gradient(560px 340px at 10% 100%, rgba(240, 128, 90, .22), transparent 70%),
      radial-gradient(560px 340px at 90% 100%, rgba(63, 123, 255, .18), transparent 70%),
      radial-gradient(700px 280px at 50% 112%, rgba(165, 92, 255, .16), transparent 70%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(17,17,19,.10) 1px, transparent 1.1px);
          background-size: 20px 20px; -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 25%, transparent 80%); }

  /* one centred column: equal space above and below */
  .page { position: absolute; inset: 0; padding: 0 var(--side); display: flex; flex-direction: column; justify-content: center; }

  .lockup { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .icon { width: 88px; height: 88px; border-radius: 21px; background: var(--grad); display: grid; place-items: center; position: relative; flex: none;
          box-shadow: 0 5px 11px rgba(60,30,140,.18), 0 11px 35px rgba(130,80,255,.30), inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -2px 7px rgba(0,0,0,.14); }
  .icon::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
                  background: radial-gradient(120% 70% at 30% 0%, rgba(255,255,255,.35), transparent 55%); }
  .icon svg { width: 55px; height: 55px; color: #fff; position: relative; }
  h1 { font-size: 80px; font-weight: 800; letter-spacing: -3.2px; line-height: 1; margin-top: -8px; white-space: pre; }
  h1 .dash { color: #A1A1A6; }
  h1 .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }

  .slogan { margin-top: 18px; text-align: center; font-size: 36px; font-weight: 600; letter-spacing: -.8px; line-height: 1.15; }
  .slogan .c1 { color: var(--claude); } .slogan .c2 { color: var(--codex); }

  /* how to use it: three steps */
  .steps { margin-top: 46px; display: flex; gap: 36px; position: relative; }
  .step { flex: 1; height: 214px; border-radius: 26px; background: #fff; border: 1px solid rgba(0,0,0,.06); position: relative;
          display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 28px;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 40px rgba(20,20,45,.08); }
  .num { position: absolute; top: 18px; left: 18px; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff;
         display: grid; place-items: center; font-size: 18px; font-weight: 750; }
  .art { position: absolute; top: 34px; left: 0; right: 0; height: 104px; display: flex; align-items: center; justify-content: center; }
  .say { font-size: 27px; font-weight: 700; letter-spacing: -.6px; white-space: nowrap; height: 34px; line-height: 34px; }
  .arrow { position: absolute; top: 86px; width: 40px; height: 40px; border-radius: 50%; background: #fff; z-index: 2;
           border: 1px solid rgba(0,0,0,.07); box-shadow: 0 6px 16px rgba(20,20,45,.10); display: grid; place-items: center; }
  .arrow svg { width: 20px; height: 20px; color: var(--ink2); }

  .tile { width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; position: relative;
          box-shadow: 0 10px 26px rgba(20,20,45,.18); }
  .tile > svg { width: 52px; height: 52px; color: #fff; }
  .badge { position: absolute; top: -12px; right: -12px; width: 40px; height: 40px; border-radius: 50%; border: 4px solid #fff;
           display: grid; place-items: center; }
  .badge svg { width: 20px; height: 20px; color: #fff; }

  .menubar { width: 236px; height: 60px; border-radius: 16px; background: #fff; border: 1px solid rgba(0,0,0,.08); position: relative;
             box-shadow: 0 10px 26px rgba(20,20,45,.14); display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 18px;
             font-size: 21px; font-weight: 600; }
  .menubar .wifi { width: 24px; height: 19px; }
  .mini { width: 42px; height: 42px; border-radius: 11px; background: var(--grad); display: grid; place-items: center;
          box-shadow: 0 0 0 4px rgba(165,92,255,.16); }
  .mini svg { width: 27px; height: 27px; color: #fff; }
  .cursor { position: absolute; left: 150px; top: 36px; width: 38px; height: 38px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }

  /* where to find it: one link on each side */
  .links { margin-top: 44px; display: flex; justify-content: space-between; align-items: center;
           font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  .links a { display: flex; align-items: center; gap: 14px; color: var(--ink); text-decoration: none; }
  .links .gh { width: 36px; height: 36px; fill: var(--ink); }
  .links .xm { width: 30px; height: 30px; fill: var(--ink); }
</style></head>
<body>
  <div class="glow"></div>
  <div class="dots"></div>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8H6M9.5 4.5 6 8l3.5 3.5"/><path d="M6 16h12M14.5 12.5 18 16l-3.5 3.5"/></symbol>
    <symbol id="term" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></symbol>
    <symbol id="bang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
      <path d="M12 5.5v8.5M12 18.5v.01"/></symbol>
    <symbol id="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <div class="page">
    <div class="lockup">
      <div class="icon"><svg><use href="#swap"/></svg></div>
      <h1>ccx <span class="dash">-</span> <span class="grad">claudecodex</span></h1>
    </div>

    <div class="slogan">Sync task context between <span class="c1">Claude</span> and <span class="c2">Codex.</span></div>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div class="art">
          <div class="tile" style="background:var(--claude)"><svg><use href="#term"/></svg>
            <span class="badge" style="background:var(--red)"><svg><use href="#bang"/></svg></span></div>
        </div>
        <div class="say">Claude hits its limit</div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div class="art">
          <div class="menubar">
            <svg class="wifi" viewBox="0 0 20 16" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round"><path d="M2 5.5a12 12 0 0 1 16 0M5 9a7.5 7.5 0 0 1 10 0M8 12.4a3 3 0 0 1 4 0"/></svg>
            <span class="mini"><svg><use href="#swap"/></svg></span>
            <span>9:41</span>
            <svg class="cursor" viewBox="0 0 28 28"><path d="M5 3.5v18.2l4.6-4.4 3 7 3.3-1.4-3-6.9h6.4z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
        </div>
        <div class="say">Click ⇄ in the menu bar</div>
      </div>
      <div class="step">
        <div class="num">3</div>
        <div class="art">
          <div class="tile" style="background:var(--ink)"><svg><use href="#term"/></svg>
            <span class="badge" style="background:var(--green)"><svg><use href="#tick"/></svg></span></div>
        </div>
        <div class="say">Codex picks up the task</div>
      </div>
      <span class="arrow" style="left: calc((100% - 72px) / 3 + 18px - 20px)"><svg><use href="#next"/></svg></span>
      <span class="arrow" style="left: calc((100% - 72px) / 3 * 2 + 54px - 20px)"><svg><use href="#next"/></svg></span>
    </div>

    <div class="links">
      <a><svg class="gh" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>github.com/aaronwong1999/ccx</a>
      <a><svg class="xm" viewBox="0 0 24 24"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.17h1.7L7.4 4.74H5.58l11.09 14.43z"/></svg>Follow @aaron0x10</a>
    </div>
  </div>
</body></html>
